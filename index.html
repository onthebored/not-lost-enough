<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="NLE">
  <meta name="theme-color" content="#0e0e0e">
  <title>NOT LOST ENOUGH</title>
  <style>
    :root {
      --bg: #0e0e0e;
      --surface: #1a1a1a;
      --text-primary: #e8e0d0;
      --text-secondary: #8a8478;
      --accent: #c8502a;
      --border: #2e2e2e;
      --font: 'Menlo', monospace;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background-color: var(--bg);
      color: var(--text-primary);
      font-family: var(--font);
      min-height: 100vh;
      padding: 28px 20px 60px;
      -webkit-text-size-adjust: 100%;
    }

    h1 {
      font-size: 1.7rem;
      letter-spacing: 0.15em;
      text-transform: uppercase;
    }

    .sub {
      color: var(--text-secondary);
      font-size: 0.72rem;
      margin-top: 4px;
      letter-spacing: 0.05em;
    }

    .app-header {
      border-bottom: 1px solid var(--border);
      padding-bottom: 16px;
      margin-bottom: 28px;
    }

    .screen { display: none; }
    .screen.active { display: block; }

    label {
      display: block;
      font-size: 0.68rem;
      color: var(--text-secondary);
      margin-bottom: 8px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    input.field, textarea.field {
      font-family: var(--font);
      font-size: 1.1rem;
      color: var(--text-primary);
      background: var(--surface);
      border: 1px solid var(--border);
      padding: 14px;
      width: 100%;
      outline: none;
      resize: vertical;
    }

    input.field:focus, textarea.field:focus { border-color: var(--accent); }
    input.field:disabled {
      color: var(--accent);
      -webkit-text-fill-color: var(--accent);
      opacity: 1;
      border-color: var(--accent);
    }

    .btn {
      font-family: var(--font);
      text-transform: uppercase;
      letter-spacing: 0.1em;
      font-size: 0.9rem;
      padding: 15px 24px;
      border: 1px solid var(--accent);
      background: transparent;
      color: var(--accent);
      cursor: pointer;
      width: 100%;
      margin-top: 14px;
    }

    .btn:active { background: var(--accent); color: var(--bg); }
    .btn:disabled { opacity: 0.3; cursor: default; }

    .btn-secondary { border-color: var(--border); color: var(--text-secondary); }
    .btn-secondary:active { background: var(--surface); color: var(--text-primary); }

    .divider { border: none; border-top: 1px solid var(--border); margin: 26px 0; }

    /* dice resolve */
    .resolve-line {
      font-size: 1.15rem;
      margin-top: 16px;
      letter-spacing: 0.04em;
    }
    .resolve-arrow { color: var(--text-secondary); }
    .resolve-val { color: var(--accent); text-transform: uppercase; }

    /* choose list */
    .choose-btn {
      display: block;
      width: 100%;
      text-align: left;
      font-family: var(--font);
      font-size: 1rem;
      padding: 14px;
      border: 1px solid var(--border);
      background: transparent;
      color: var(--text-primary);
      cursor: pointer;
      margin-top: 8px;
    }
    .choose-btn:active { border-color: var(--accent); color: var(--accent); }

    /* wander step */
    .step-counter {
      font-size: 0.62rem;
      color: var(--text-secondary);
      letter-spacing: 0.1em;
      margin-bottom: 18px;
    }
    .seed-line {
      font-size: 0.62rem;
      color: var(--text-secondary);
      letter-spacing: 0.06em;
      margin-bottom: 18px;
    }
    .seed-line b { color: var(--accent); font-weight: normal; }

    .directive {
      font-size: 1.35rem;
      line-height: 1.5;
      margin: 10px 0 28px;
    }

    .timer-display {
      font-size: 3rem;
      text-align: center;
      color: var(--accent);
      letter-spacing: 0.08em;
      margin: 20px 0;
    }

    .compass-rose {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      margin-top: 10px;
    }
    .compass-btn {
      font-family: var(--font);
      font-size: 0.95rem;
      padding: 20px 0;
      border: 1px solid var(--border);
      background: transparent;
      color: var(--text-primary);
      cursor: pointer;
      letter-spacing: 0.08em;
    }
    .compass-btn:active { background: var(--accent); color: var(--bg); }
    .compass-btn.empty { visibility: hidden; }
    .compass-btn.selected { background: var(--accent); color: var(--bg); }

    .gps-readout {
      font-size: 1rem;
      color: var(--accent);
      text-align: center;
      padding: 16px;
      border: 1px solid var(--border);
      margin: 10px 0;
      letter-spacing: 0.04em;
      min-height: 56px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* summary + log */
    .summary-row {
      display: grid;
      grid-template-columns: 110px 1fr;
      gap: 10px;
      padding: 10px 0;
      border-bottom: 1px solid var(--border);
      font-size: 0.85rem;
    }
    .summary-key { color: var(--text-secondary); font-size: 0.62rem; letter-spacing: 0.06em; padding-top: 3px; text-transform: uppercase; }
    .summary-val { color: var(--text-primary); line-height: 1.5; }
    .summary-val.empty { color: var(--border); }

    .log-entry {
      font-size: 0.72rem;
      color: var(--text-secondary);
      padding: 6px 0;
      line-height: 1.5;
      border-bottom: 1px solid #1c1c1c;
    }
    .log-entry b { color: var(--text-primary); font-weight: normal; }

    .record-item {
      border: 1px solid var(--border);
      padding: 12px 14px;
      margin-bottom: 8px;
      cursor: pointer;
    }
    .record-item:active { border-color: var(--accent); }
    .record-date { font-size: 0.65rem; color: var(--text-secondary); }
    .record-summary { font-size: 0.9rem; margin-top: 4px; }
    .record-summary .accent { color: var(--accent); }

    .status-line {
      font-size: 0.7rem;
      color: var(--text-secondary);
      margin-top: 10px;
      letter-spacing: 0.04em;
    }
  </style>
</head>
<body>

  <!-- HOME -->
  <div id="screen-home" class="screen active">
    <div class="app-header">
      <h1>Not Lost Enough</h1>
      <div class="sub">Field Research Application — v0.4</div>
    </div>
    <button class="btn" onclick="beginSession()">Initiate Wander</button>
    <button class="btn btn-secondary" onclick="openRecords()">Field Log</button>
  </div>

  <!-- ROLL 1: PRACTICE -->
  <div id="screen-roll-practice" class="screen">
    <div class="app-header">
      <h1>Roll I</h1>
      <div class="sub">Determine Practice</div>
    </div>
    <label>Roll 1 die, input outcome</label>
    <input class="field" type="number" id="roll-practice-input" min="1" max="6" inputmode="numeric">
    <div id="roll-practice-resolved"></div>
    <button class="btn" id="roll-practice-btn" onclick="resolvePractice()">Enter</button>
  </div>

  <!-- ROLL 2: LOCATION -->
  <div id="screen-roll-location" class="screen">
    <div class="app-header">
      <h1>Roll II</h1>
      <div class="sub">Determine Start Point</div>
    </div>
    <label>Roll again, input outcome</label>
    <input class="field" type="number" id="roll-location-input" min="1" max="6" inputmode="numeric">
    <div id="roll-location-resolved"></div>
    <div id="choose-location-list"></div>
    <button class="btn" id="roll-location-btn" onclick="resolveLocation()">Enter</button>
  </div>

  <!-- WANDER -->
  <div id="screen-wander" class="screen">
    <div class="seed-line" id="wander-seed"></div>
    <div class="step-counter" id="wander-counter"></div>
    <div class="directive" id="wander-directive"></div>
    <div id="wander-action"></div>
  </div>

  <!-- SUMMARY -->
  <div id="screen-summary" class="screen">
    <div class="app-header">
      <h1>Wander Record</h1>
      <div class="sub" id="summary-sub"></div>
    </div>
    <div id="summary-fields"></div>
    <div class="divider"></div>
    <label>Full Log</label>
    <div id="summary-log"></div>
    <div class="divider"></div>
    <button class="btn btn-secondary" onclick="showScreen('screen-home')">Return Home</button>
  </div>

  <!-- RECORDS -->
  <div id="screen-records" class="screen">
    <div class="app-header">
      <h1>Field Log</h1>
      <div class="sub">Wander Records</div>
    </div>
    <div id="records-container"></div>
    <div class="divider"></div>
    <button class="btn btn-secondary" onclick="exportRecords()">Export Log</button>
    <div class="status-line" id="records-status"></div>
    <div class="divider"></div>
    <button class="btn btn-secondary" onclick="showScreen('screen-home')">Return Home</button>
  </div>

  <script>
    // ============================================================
    // STATIC TABLES
    // ============================================================
    const PRACTICE_TABLE = {
      1: 'drawing',
      2: 'painting',
      3: 'sculpture',
      4: 'writing',
      5: 'sewing',
      6: 'wild card'
    };

    const LOCATION_TABLE = {
      1: 'Home',
      2: 'Belle Isle',
      3: 'CHOOSE',
      4: 'Tenacity Brewery',
      5: 'Detroit Library',
      6: 'DMOCA / Downtown'
    };

    const CHOOSE_OPTIONS = ['Home', 'Belle Isle', 'Tenacity Brewery', 'Detroit Library', 'DMOCA / Downtown'];

    // ============================================================
    // SCRIPTS  (only drawing complete for v0.4)
    // Each step: { text, action, ...opts }
    // action: 'here' | 'done' | 'text' | 'timer' | 'direction' | 'gps'
    // {{poem}} in text is replaced live with the named poem
    // ============================================================
    const SCRIPTS = {
      drawing: [
        { text: 'From your start point, walk to an area that feels entirely new.', action: 'here' },
        { text: 'Continue walking and find a place to sit comfortably.', action: 'here' },
        { text: 'Write a short poem or word piece in the next 10 minutes, based on your surroundings.', action: 'timer', seconds: 600, label: 'poem' },
        { text: 'Name the poem.', action: 'text', field: 'poemName', placeholder: 'poem title…' },
        { text: "Study the sun's position in the sky, its direction, and how its light is affecting your surroundings.", action: 'done' },
        { text: 'Choose a direction to follow based on these observations.', action: 'direction' },
        { text: 'Head in that direction by way of sidewalks. Walk for 7 minutes.', action: 'timer', seconds: 420, label: 'walk' },
        { text: 'Find a tree that suits the name of your poem: “{{poem}}”.', action: 'here' },
        { text: 'Sketch the tree.', action: 'done' },
        { text: 'Give the tree a mood or emotion.', action: 'text', field: 'treeMood', placeholder: 'mood or emotion…' },
        { text: 'Logging coordinates.', action: 'gps' },
        { text: 'Head home.', action: 'done' }
      ]
    };

    const SCRIPT_READY = Object.keys(SCRIPTS);

    // ============================================================
    // STORAGE
    // ============================================================
    let records = JSON.parse(localStorage.getItem('nle-records') || '[]');
    function saveRecords() { localStorage.setItem('nle-records', JSON.stringify(records)); }

    // ============================================================
    // SESSION STATE
    // ============================================================
    let session = null;
    let timerInterval = null;

    function showScreen(id) {
      document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
      document.getElementById(id).classList.add('active');
      window.scrollTo(0, 0);
    }

    function logEvent(type, detail) {
      session.log.push({ at: new Date().toISOString(), type, ...detail });
    }

    // ============================================================
    // ROLL 1 — PRACTICE
    // ============================================================
    function beginSession() {
      session = {
        id: 'W-' + Date.now(),
        startedAt: new Date().toISOString(),
        practice: null,
        location: null,
        stepIndex: 0,
        inputs: {},
        log: []
      };
      document.getElementById('roll-practice-input').value = '';
      document.getElementById('roll-practice-input').disabled = false;
      document.getElementById('roll-practice-resolved').innerHTML = '';
      const btn = document.getElementById('roll-practice-btn');
      btn.textContent = 'Enter';
      btn.onclick = resolvePractice;
      showScreen('screen-roll-practice');
    }

    function resolvePractice() {
      const input = document.getElementById('roll-practice-input');
      const n = parseInt(input.value, 10);
      if (!(n >= 1 && n <= 6)) { input.focus(); return; }

      input.disabled = true;
      session.practice = PRACTICE_TABLE[n];
      logEvent('roll', { roll: 'practice', value: n, result: session.practice });

      document.getElementById('roll-practice-resolved').innerHTML =
        `<div class="resolve-line"><span class="resolve-arrow">= </span><span class="resolve-val">${session.practice}</span></div>`;

      const btn = document.getElementById('roll-practice-btn');
      btn.textContent = 'Continue';
      btn.onclick = goToLocationRoll;
    }

    function goToLocationRoll() {
      document.getElementById('roll-location-input').value = '';
      document.getElementById('roll-location-input').disabled = false;
      document.getElementById('roll-location-input').style.display = 'block';
      document.getElementById('roll-location-resolved').innerHTML = '';
      document.getElementById('choose-location-list').innerHTML = '';
      const btn = document.getElementById('roll-location-btn');
      btn.textContent = 'Enter';
      btn.style.display = 'block';
      btn.onclick = resolveLocation;
      showScreen('screen-roll-location');
    }

    // ============================================================
    // ROLL 2 — LOCATION
    // ============================================================
    function resolveLocation() {
      const input = document.getElementById('roll-location-input');
      const n = parseInt(input.value, 10);
      if (!(n >= 1 && n <= 6)) { input.focus(); return; }

      input.disabled = true;
      const result = LOCATION_TABLE[n];
      logEvent('roll', { roll: 'location', value: n, result });

      if (result === 'CHOOSE') {
        document.getElementById('roll-location-resolved').innerHTML =
          `<div class="resolve-line"><span class="resolve-arrow">= </span><span class="resolve-val">choose</span></div>`;
        const list = document.getElementById('choose-location-list');
        list.innerHTML = '<label style="margin-top:20px;">Select start point</label>' +
          CHOOSE_OPTIONS.map(o => `<button class="choose-btn" onclick="pickLocation('${o.replace(/'/g, "\\'")}')">${o}</button>`).join('');
        document.getElementById('roll-location-btn').style.display = 'none';
      } else {
        session.location = result;
        document.getElementById('roll-location-resolved').innerHTML =
          `<div class="resolve-line"><span class="resolve-arrow">= </span><span class="resolve-val">${result}</span></div>`;
        const btn = document.getElementById('roll-location-btn');
        btn.textContent = 'Begin Wander';
        btn.onclick = startWander;
      }
    }

    function pickLocation(name) {
      session.location = name;
      logEvent('choose', { field: 'location', value: name });
      document.getElementById('choose-location-list').innerHTML =
        `<div class="resolve-line" style="margin-top:20px;"><span class="resolve-arrow">start = </span><span class="resolve-val">${name}</span></div>`;
      const btn = document.getElementById('roll-location-btn');
      btn.style.display = 'block';
      btn.textContent = 'Begin Wander';
      btn.onclick = startWander;
    }

    // ============================================================
    // WANDER RUNNER
    // ============================================================
    function startWander() {
      session.stepIndex = 0;

      if (!SCRIPTS[session.practice]) {
        // practice rolled but no script yet
        showScreen('screen-wander');
        document.getElementById('wander-seed').innerHTML =
          `<b>${session.practice}</b> · ${session.location}`;
        document.getElementById('wander-counter').textContent = '';
        document.getElementById('wander-directive').textContent =
          `No script written yet for "${session.practice}". Only Drawing is ready in this test build.`;
        document.getElementById('wander-action').innerHTML =
          `<button class="btn btn-secondary" onclick="showScreen('screen-home')">Return Home</button>`;
        logEvent('abort', { reason: 'no-script', practice: session.practice });
        return;
      }

      showScreen('screen-wander');
      renderStep();
    }

    function currentScript() { return SCRIPTS[session.practice]; }

    function fillText(text) {
      return text.replace('{{poem}}', session.inputs.poemName || '…');
    }

    function fmtMS(total) {
      const s = Math.max(0, Math.floor(total));
      return String(Math.floor(s / 60)).padStart(2, '0') + ':' + String(s % 60).padStart(2, '0');
    }

    function renderStep() {
      const script = currentScript();
      const step = script[session.stepIndex];

      document.getElementById('wander-seed').innerHTML =
        `<b>${session.practice}</b> · ${session.location}`;
      document.getElementById('wander-counter').textContent =
        `STEP ${session.stepIndex + 1} / ${script.length}`;
      document.getElementById('wander-directive').textContent = fillText(step.text);

      const action = document.getElementById('wander-action');
      action.innerHTML = '';

      switch (step.action) {
        case 'here':
          action.innerHTML = `<button class="btn" onclick="completeStep()">I'm Here</button>`;
          break;

        case 'done':
          action.innerHTML = `<button class="btn" onclick="completeStep()">Done</button>`;
          break;

        case 'text':
          action.innerHTML = `
            <textarea class="field" id="step-text-input" rows="3" placeholder="${step.placeholder || ''}"></textarea>
            <button class="btn" onclick="completeTextStep('${step.field}')">Done</button>`;
          setTimeout(() => document.getElementById('step-text-input').focus(), 100);
          break;

        case 'timer':
          action.innerHTML = `
            <div class="timer-display" id="timer-display">${fmtMS(step.seconds)}</div>
            <button class="btn" id="timer-start" onclick="startTimer(${step.seconds}, '${step.label}')">Start</button>
            <button class="btn btn-secondary" onclick="completeStep()">Skip / Done Early</button>`;
          break;

        case 'direction':
          renderDirection();
          break;

        case 'gps':
          renderGPS();
          break;
      }
      window.scrollTo(0, 0);
    }

    function completeStep() {
      const step = currentScript()[session.stepIndex];
      logEvent('step', { index: session.stepIndex + 1, text: fillText(step.text), action: step.action });
      advance();
    }

    function completeTextStep(field) {
      const val = document.getElementById('step-text-input').value.trim();
      session.inputs[field] = val;
      const step = currentScript()[session.stepIndex];
      logEvent('input', { index: session.stepIndex + 1, field, value: val, text: fillText(step.text) });
      advance();
    }

    function startTimer(seconds, label) {
      const display = document.getElementById('timer-display');
      const btn = document.getElementById('timer-start');
      btn.disabled = true;
      btn.textContent = 'Running…';
      logEvent('timer-start', { index: session.stepIndex + 1, label, seconds });
      let left = seconds;
      if (timerInterval) clearInterval(timerInterval);
      timerInterval = setInterval(() => {
        left--;
        display.textContent = fmtMS(left);
        if (left <= 0) {
          clearInterval(timerInterval);
          timerInterval = null;
          display.textContent = '00:00';
          if (navigator.vibrate) navigator.vibrate(400);
          btn.disabled = false;
          btn.textContent = 'Continue';
          btn.onclick = function () {
            logEvent('timer-end', { index: session.stepIndex + 1, label });
            advance();
          };
        }
      }, 1000);
    }

    function renderDirection() {
      const grid = ['NW', 'N', 'NE', 'W', null, 'E', 'SW', 'S', 'SE'];
      const action = document.getElementById('wander-action');
      action.innerHTML = `<div class="compass-rose">` +
        grid.map(d => d
          ? `<button class="compass-btn" onclick="pickDirection(this,'${d}')">${d}</button>`
          : `<button class="compass-btn empty"></button>`
        ).join('') + `</div>
        <button class="btn" id="dir-confirm" onclick="confirmDirection()" disabled>Confirm</button>`;
      session._pendingDir = null;
    }

    function pickDirection(btn, dir) {
      document.querySelectorAll('.compass-btn').forEach(b => b.classList.remove('selected'));
      btn.classList.add('selected');
      session._pendingDir = dir;
      document.getElementById('dir-confirm').disabled = false;
    }

    function confirmDirection() {
      if (!session._pendingDir) return;
      session.inputs.direction = session._pendingDir;
      logEvent('direction', { index: session.stepIndex + 1, value: session._pendingDir });
      session._pendingDir = null;
      advance();
    }

    function renderGPS() {
      const action = document.getElementById('wander-action');
      action.innerHTML = `
        <div class="gps-readout" id="gps-readout">— — —</div>
        <button class="btn" id="gps-btn" onclick="captureGPS()">Capture Coordinates</button>
        <button class="btn btn-secondary" onclick="skipGPS()">Skip</button>`;
    }

    function captureGPS() {
      const readout = document.getElementById('gps-readout');
      const btn = document.getElementById('gps-btn');
      if (!navigator.geolocation) {
        readout.textContent = 'no geolocation';
        return;
      }
      readout.textContent = 'locating…';
      btn.disabled = true;
      navigator.geolocation.getCurrentPosition(
        pos => {
          const lat = pos.coords.latitude.toFixed(5);
          const lon = pos.coords.longitude.toFixed(5);
          session.inputs.gps = { lat, lon };
          readout.textContent = `${lat}, ${lon}`;
          logEvent('gps', { index: session.stepIndex + 1, lat, lon });
          btn.textContent = 'Continue';
          btn.disabled = false;
          btn.onclick = advance;
        },
        err => {
          readout.textContent = 'denied / unavailable';
          btn.textContent = 'Continue Anyway';
          btn.disabled = false;
          btn.onclick = advance;
          logEvent('gps', { index: session.stepIndex + 1, error: err.message });
        },
        { enableHighAccuracy: true, timeout: 10000 }
      );
    }

    function skipGPS() {
      logEvent('gps', { index: session.stepIndex + 1, skipped: true });
      advance();
    }

    function advance() {
      session.stepIndex++;
      if (session.stepIndex >= currentScript().length) {
        endWander();
      } else {
        renderStep();
      }
    }

    // ============================================================
    // END + SUMMARY
    // ============================================================
    function endWander() {
      session.endedAt = new Date().toISOString();
      records.unshift(session);
      saveRecords();
      renderSummary(session);
      showScreen('screen-summary');
    }

    function renderSummary(s) {
      const start = new Date(s.startedAt);
      const mins = s.endedAt ? Math.round((new Date(s.endedAt) - start) / 60000) : 0;
      document.getElementById('summary-sub').textContent =
        `${start.toLocaleString()} — ${mins} min`;

      const rows = [
        ['Practice', s.practice],
        ['Start', s.location],
        ['Poem', s.inputs.poemName],
        ['Direction', s.inputs.direction],
        ['Tree Mood', s.inputs.treeMood],
        ['GPS', s.inputs.gps ? `${s.inputs.gps.lat}, ${s.inputs.gps.lon}` : null]
      ];

      document.getElementById('summary-fields').innerHTML = rows.map(([k, v]) => `
        <div class="summary-row">
          <div class="summary-key">${k}</div>
          <div class="summary-val ${v ? '' : 'empty'}">${v || '—'}</div>
        </div>`).join('');

      document.getElementById('summary-log').innerHTML = s.log.map(e => {
        const t = new Date(e.at).toLocaleTimeString();
        let line = '';
        if (e.type === 'roll') line = `rolled ${e.value} → <b>${e.result}</b>`;
        else if (e.type === 'choose') line = `chose <b>${e.value}</b>`;
        else if (e.type === 'step') line = `step ${e.index}: ${e.text}`;
        else if (e.type === 'input') line = `step ${e.index} · ${e.field} = <b>${e.value || '(blank)'}</b>`;
        else if (e.type === 'timer-start') line = `timer start (${e.label}, ${e.seconds}s)`;
        else if (e.type === 'timer-end') line = `timer end (${e.label})`;
        else if (e.type === 'direction') line = `direction = <b>${e.value}</b>`;
        else if (e.type === 'gps') line = e.skipped ? 'gps skipped' : (e.error ? `gps error` : `gps <b>${e.lat}, ${e.lon}</b>`);
        else if (e.type === 'abort') line = `aborted — ${e.reason}`;
        else line = e.type;
        return `<div class="log-entry">${t} — ${line}</div>`;
      }).join('');
    }

    // ============================================================
    // RECORDS
    // ============================================================
    function openRecords() {
      const c = document.getElementById('records-container');
      if (records.length === 0) {
        c.innerHTML = '<div class="status-line">// no wanders recorded</div>';
      } else {
        c.innerHTML = records.map((r, i) => `
          <div class="record-item" onclick="viewRecord(${i})">
            <div class="record-date">${new Date(r.startedAt).toLocaleString()}</div>
            <div class="record-summary"><span class="accent">${r.practice}</span> · ${r.location}${r.inputs.poemName ? ' · “' + r.inputs.poemName + '”' : ''}</div>
          </div>`).join('');
      }
      document.getElementById('records-status').textContent = '';
      showScreen('screen-records');
    }

    function viewRecord(i) {
      renderSummary(records[i]);
      showScreen('screen-summary');
    }

    function exportRecords() {
      const status = document.getElementById('records-status');
      if (records.length === 0) { status.textContent = '// nothing to export'; return; }
      const payload = { format: 'NLE-FIELD-LOG', version: 1, exportedAt: new Date().toISOString(), records };
      const blob = new Blob([JSON.stringify(payload, null, 2)], { type: 'application/json' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `nle-log-${new Date().toISOString().slice(0, 10)}.json`;
      document.body.appendChild(a); a.click(); document.body.removeChild(a);
      URL.revokeObjectURL(url);
      status.textContent = `// exported ${records.length} record(s)`;
    }
  </script>

</body>
